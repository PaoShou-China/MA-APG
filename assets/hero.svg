<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">MA-APG differentiable recurrent control model</title><desc id="desc">State enters a GRU policy, which produces a bounded action. RK4 propagates the nonlinear system and the episode objective is differentiated through the rollout.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#dbe4e1"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#297f7c"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#bd6b48"/></marker></defs><rect width="1200" height="620" rx="18" fill="#f7f8f5"/><rect x="24" y="24" width="1152" height="572" rx="12" fill="url(#grid)" stroke="#d4ddd9"/><text x="58" y="70" font-family="system-ui,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#297f7c">DIFFERENTIABLE RECURRENT CONTROL</text><text x="58" y="105" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#1b2d3a">Controller → nonlinear rollout → episode objective</text><rect x="55" y="191" width="185" height="142" rx="12" fill="#fff" stroke="#99b7b1" stroke-width="2"/><text x="147" y="226" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#56706f">STATE</text><text x="147" y="269" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#1b2d3a">xₖ = [x₁, x₂]ᵀ</text><text x="147" y="302" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#667780">position · velocity</text><path d="M241 262H310" stroke="#297f7c" stroke-width="3" marker-end="url(#a)"/><rect x="320" y="166" width="232" height="191" rx="15" fill="#e4efec" stroke="#297f7c" stroke-width="2"/><text x="436" y="201" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#297f7c">RECURRENT POLICY</text><rect x="358" y="222" width="156" height="66" rx="11" fill="#fff" stroke="#9abbb5" stroke-width="1.5"/><text x="436" y="264" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#235d5c">GRU</text><text x="436" y="321" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#52676e">hₖ₊₁ = f(xₖ, hₖ)</text><path d="M553 262H625" stroke="#297f7c" stroke-width="3" marker-end="url(#a)"/><rect x="635" y="191" width="155" height="142" rx="12" fill="#fff" stroke="#d1a78f" stroke-width="2"/><text x="712" y="226" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#a65e42">ACTION</text><text x="712" y="270" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#1b2d3a">uₖ ∈ [−30,30]</text><text x="712" y="302" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#667780">sigmoid mapped</text><path d="M791 262H862" stroke="#297f7c" stroke-width="3" marker-end="url(#a)"/><rect x="872" y="166" width="272" height="191" rx="15" fill="#e8edf4" stroke="#657ca0" stroke-width="2"/><text x="1008" y="201" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#536c90">NONLINEAR SYSTEM</text><text x="1008" y="248" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#1b2d3a">ẋ₁ = x₂</text><text x="1008" y="280" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#1b2d3a">ẋ₂ = x₁ + b u + sin(b)</text><text x="1008" y="322" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#667780">RK4 step → xₖ₊₁</text><path d="M1008 360V418H147V340" fill="none" stroke="#297f7c" stroke-width="2.5" marker-end="url(#a)"/><text x="578" y="407" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#297f7c">state passed to the next control step</text><rect x="286" y="453" width="650" height="79" rx="12" fill="#fff1e8" stroke="#d6a489" stroke-width="1.5"/><text x="611" y="481" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#a65e42">EPISODE OBJECTIVE · GRADIENT THROUGH ROLLOUT</text><text x="611" y="509" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#1b2d3a">rₖ = −Δt [(x₁−x₁*)² + 0.1(x₂−x₂*)² + 0.01u²]</text><path d="M887 359V435H936V489" fill="none" stroke="#bd6b48" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#b)"/><path d="M285 490H254V382H436V358" fill="none" stroke="#bd6b48" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#b)"/><text x="58" y="568" font-family="system-ui,sans-serif" font-size="12" fill="#667780">Architecture schematic from system.py and train.py; no measured trajectory is shown.</text></svg>