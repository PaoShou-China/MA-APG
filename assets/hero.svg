<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">MA-APG differentiable recurrent control architecture</title>
<desc id="desc">A code-grounded schematic: the two-state system enters a two-layer GRU controller, which outputs bounded action. The system advances by RK4 and returns the next state and per-step reward. Gradients pass through the rollout to train the controller. The plotted trajectory is conceptual, not measured data.</desc>
<defs>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e5ebf1" stroke-width="1"/></pattern>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#234c78"/></marker>
 <marker id="redArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#bb3038"/></marker>
</defs>
<rect width="1200" height="650" rx="20" fill="#f7f9fc"/><rect x="20" y="20" width="1160" height="610" rx="14" fill="url(#grid)" stroke="#d6dee8"/>
<text x="56" y="65" font-family="system-ui,sans-serif" font-size="13" font-weight="750" letter-spacing="2.2" fill="#345f8e">DIFFERENTIABLE CONTROL · MODEL AND TRAINING PATH</text>
<text x="56" y="103" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#122b49">Policy, nonlinear dynamics, and gradients through time</text>
<!-- state -->
<rect x="54" y="173" width="206" height="150" rx="12" fill="#fff" stroke="#a9bacb" stroke-width="1.5"/>
<text x="157" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="750" letter-spacing="1.5" fill="#48647f">STATE INPUT</text>
<text x="157" y="250" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#122b49">xₖ = [x₁, x₂]ᵀ</text>
<text x="157" y="282" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#64758a">position · velocity</text>
<path d="M261 248h55" stroke="#234c78" stroke-width="2.5" marker-end="url(#arrow)"/>
<!-- policy -->
<rect x="327" y="150" width="246" height="196" rx="14" fill="#eaf0f7" stroke="#6685a5" stroke-width="1.7"/>
<text x="450" y="184" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="750" letter-spacing="1.4" fill="#345f8e">RECURRENT POLICY</text>
<rect x="363" y="204" width="174" height="53" rx="9" fill="#fff" stroke="#9fb1c4"/>
<text x="450" y="237" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#17395f">GRU layer 1</text>
<path d="M450 258v21" stroke="#345f8e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="363" y="284" width="174" height="41" rx="8" fill="#fff" stroke="#9fb1c4"/>
<text x="450" y="310" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#17395f">GRU layer 2</text>
<path d="M574 248h55" stroke="#234c78" stroke-width="2.5" marker-end="url(#arrow)"/>
<!-- action -->
<rect x="640" y="173" width="184" height="150" rx="12" fill="#fff" stroke="#c63b43" stroke-width="1.7"/>
<text x="732" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="750" letter-spacing="1.5" fill="#a92c35">CONTROL</text>
<text x="732" y="250" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#122b49">uₖ ∈ [−30, 30]</text>
<text x="732" y="282" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#64758a">sigmoid action map</text>
<path d="M825 248h55" stroke="#234c78" stroke-width="2.5" marker-end="url(#arrow)"/>
<!-- system -->
<rect x="891" y="150" width="255" height="196" rx="14" fill="#fff" stroke="#a9bacb" stroke-width="1.5"/>
<text x="1018" y="184" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="750" letter-spacing="1.4" fill="#345f8e">NONLINEAR SYSTEM</text>
<text x="1018" y="229" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#122b49">ẋ₁ = x₂</text>
<text x="1018" y="263" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#122b49">ẋ₂ = x₁ + b u + sin(b)</text>
<text x="1018" y="307" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#64758a">RK4 step → xₖ₊₁</text>
<!-- recurrent loop -->
<path d="M1018 350v51H157v-77" fill="none" stroke="#234c78" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="461" y="382" width="252" height="34" rx="17" fill="#f7f9fc" stroke="#cbd6e1"/>
<text x="587" y="404" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#48647f">state feeds the next policy step</text>
<!-- objective -->
<rect x="184" y="455" width="832" height="117" rx="13" fill="#fff" stroke="#cbd6e1" stroke-width="1.4"/>
<text x="600" y="485" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="750" letter-spacing="1.5" fill="#a92c35">TRAINING OBJECTIVE · REWARD TERMS FROM system.py</text>
<text x="600" y="520" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#122b49">rₖ = −Δt [(x₁,ₖ₊₁)² + 0.1(x₂,ₖ₊₁)² + 0.01uₖ²]</text>
<text x="600" y="548" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#64758a">Terminal state receives an additional 10× state penalty; episode reward is differentiated through the rollout.</text>
<path d="M1008 348v51h72v86h-63" fill="none" stroke="#bb3038" stroke-width="2.3" stroke-dasharray="7 6" marker-end="url(#redArrow)"/>
<path d="M183 514H128V369H450V347" fill="none" stroke="#bb3038" stroke-width="2.3" stroke-dasharray="7 6" marker-end="url(#redArrow)"/>
<text x="56" y="607" font-family="system-ui,sans-serif" font-size="12" fill="#64758a">Architecture schematic derived from system.py and train.py. No measured performance or trajectory is shown.</text>
</svg>